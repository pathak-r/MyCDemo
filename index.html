<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
try{var t=localStorage.getItem('myc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MyCommunity Client Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<style>
/* Layout: dark operator sidebar + fluid workspace (matches the MyC admin app's "Operator" look); the resident's MyC view slides in from the right */
:root{
  --bg:#F6F6F2; --paper:#FFFFFF; --ink:#0E0F11; --ink2:#2A2C30; --muted:#626468; --rule:#E4E3DD; --rule2:#D2D0C8; --hover:#F1F0EB;
  --side:#0E0F11; --side-ink:#E9E8E3; --side-muted:#9C9C97; --side-hi:#202226;
  --accent:#1A2A40; --accent-ink:#FFFFFF; --link:#1F4FBF; --focus:#2756D9;
  --ok:#146C31; --ok-bg:#E3F1E6; --warn:#7A4F00; --warn-bg:#F9EDD2; --bad:#B42318; --bad-bg:#FBE5E2; --info:#1A2A40; --info-bg:#E7ECF4;
  --tile-ok:#E3F1E6; --tile-due:#F6DFA6; --tile-over:#F3B9B1; --tile-bounce:#B42318; --tile-bounce-ink:#FFFFFF; --tile-vac:transparent;
  --myc-bg:#F5EFE6; --myc-ink:#1F1B17; --myc-muted:#6A5E54; --myc-accent:#B4442A; --myc-card:#FBF7F0; --myc-rule:#E3D8C7;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; --serif:'Fraunces',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --paper:#18191C; --ink:#EDECE8; --ink2:#D3D2CD; --muted:#A09F9A; --rule:#2A2B2F; --rule2:#3A3B40; --hover:#202124;
  --side:#0A0A0B; --side-ink:#E9E8E3; --side-muted:#9C9C97; --side-hi:#1E1F23;
  --accent:#9DB8E4; --accent-ink:#0E0F11; --link:#9DB8E4; --focus:#9DB8E4;
  --ok:#7FD39A; --ok-bg:#16301F; --warn:#EBBE6A; --warn-bg:#33270F; --bad:#F59A8F; --bad-bg:#3A1A17; --info:#B5C9EA; --info-bg:#1D2633;
  --tile-ok:#1A3524; --tile-due:#4A3812; --tile-over:#5A231D; --tile-bounce:#E0584A; --tile-bounce-ink:#111214;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --paper:#18191C; --ink:#EDECE8; --ink2:#D3D2CD; --muted:#A09F9A; --rule:#2A2B2F; --rule2:#3A3B40; --hover:#202124;
  --side:#0A0A0B; --side-ink:#E9E8E3; --side-muted:#9C9C97; --side-hi:#1E1F23;
  --accent:#9DB8E4; --accent-ink:#0E0F11; --link:#9DB8E4; --focus:#9DB8E4;
  --ok:#7FD39A; --ok-bg:#16301F; --warn:#EBBE6A; --warn-bg:#33270F; --bad:#F59A8F; --bad-bg:#3A1A17; --info:#B5C9EA; --info-bg:#1D2633;
  --tile-ok:#1A3524; --tile-due:#4A3812; --tile-over:#5A231D; --tile-bounce:#E0584A; --tile-bounce-ink:#111214;
  color-scheme:dark}

html,body{height:100%;margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.app{display:flex;flex-wrap:wrap;min-height:100%}
.side{flex:1 1 236px;max-width:100%;background:var(--side);color:var(--side-ink);padding-block:22px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.side-in{position:sticky;top:calc(22px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-size:17px;font-weight:600}
.brand .eyebrow{color:var(--side-muted)}
.orgcard{background:var(--side-hi);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px}
.orgcard .eyebrow{color:var(--side-muted);font-size:10px}
.orgcard span:last-child{font-size:12.5px;color:var(--side-muted)}
.btn-new{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border-radius:8px;border:0;background:#F6F6F2;color:#0E0F11;font-weight:600;cursor:pointer}
.btn-new:hover{background:#FFFFFF}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--side-ink);text-align:left;cursor:pointer;font-size:14px}
.nav button:hover:not([disabled]){background:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-hi);font-weight:600}
.nav button[disabled]{color:#6E6E6A;cursor:default}
.nav svg{width:17px;height:17px;flex:none}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:#D63B2C;color:#fff;border-radius:999px;padding:1px 8px}
.nav .soon{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#6E6E6A}
.navlabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#6E6E6A;padding:10px 12px 4px}
.side-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid #26282C;padding-top:14px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.avatar{width:32px;height:32px;border-radius:999px;background:#FFE5DC;color:#A63A20;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.me small{display:block;color:var(--side-muted);font-size:12px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px;font-size:12px;color:var(--side-muted)}
.demo button{background:transparent;border:1px solid #3A3B40;color:var(--side-ink);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}

.main{flex:999 1 600px;min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.main{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.pagehead .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.pagehead h1{font-size:28px;font-weight:600;letter-spacing:-.02em}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field-inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=search]{min-height:40px;padding:8px 11px;border:1px solid var(--rule2);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
input::placeholder{color:var(--muted);opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border-radius:8px;border:1px solid var(--rule2);background:var(--paper);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font:inherit;text-align:left}
.link:hover{text-decoration:underline}
.namebtn{background:none;border:0;padding:0;color:var(--ink);font-weight:500;cursor:pointer;text-align:left;font:inherit;font-weight:500}
.namebtn:hover{color:var(--link);text-decoration:underline}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 14px}
.cardhead h2{font-size:16px;font-weight:600}
.cardhead .sub{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.list{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 0;border-top:1px solid var(--rule)}
.row .grow{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .meta{font-size:12.5px;color:var(--muted)}
.row .date{font-family:var(--mono);font-size:12px;color:var(--muted);width:58px;flex:none}
.empty{padding:18px 0;color:var(--muted);border-top:1px solid var(--rule)}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap;font-weight:500}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip.plain{background:var(--hover);color:var(--ink2)}
.sent{font-size:12px;color:var(--ok);white-space:nowrap}

.tablebox{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;font-weight:500;color:var(--muted);text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--rule2);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr.selected td{background:var(--info-bg)}
td.r,th.r{text-align:right}
.bar{flex:1;height:6px;background:var(--rule);border-radius:999px;min-width:60px}
.bar i{display:block;height:6px;border-radius:999px;background:var(--accent)}

/* unit grid */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--rule2)}
.floors{display:flex;flex-direction:column;gap:8px}
.floor{display:flex;align-items:stretch;gap:8px}
.floor .fl{width:62px;flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.tile{border:1px solid var(--rule2);border-radius:8px;padding:9px 10px;min-height:58px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--paper);color:var(--ink);min-width:0}
.tile b{font-family:var(--mono);font-size:12.5px;font-weight:500}
.tile span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.tile.ok{background:var(--tile-ok);border-color:transparent}
.tile.due{background:var(--tile-due);border-color:transparent}
.tile.overdue{background:var(--tile-over);border-color:transparent}
.tile.bounced{background:var(--tile-bounce);border-color:transparent;color:var(--tile-bounce-ink)}
.tile.bounced span{color:var(--tile-bounce-ink)}
.tile.vacant{background:transparent;border-style:dashed}
.tile.vacant span{color:var(--muted)}
.tile:hover{outline:2px solid var(--focus);outline-offset:1px}

/* tabs + bulk */
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--rule2)}
.tabs button{min-height:44px;padding:0 14px;border:0;background:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .count{font-family:var(--mono);font-size:11px;border-radius:999px;padding:1px 8px;background:var(--hover);color:var(--ink2)}
.tabs button[aria-selected="true"] .count{background:var(--ink);color:var(--bg)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;min-height:56px}
.bulk.on{background:var(--accent);color:var(--accent-ink)}
.bulk.off{background:var(--paper);border:1px solid var(--rule);color:var(--muted)}
.bulk .sp{flex:1}
.bulk.on .btn{background:var(--paper);color:var(--ink);border-color:transparent}
.bulk.on .btn.out{background:transparent;color:var(--accent-ink);border-color:currentColor}
.totals{display:flex;flex-wrap:wrap;gap:20px;font-size:13px;color:var(--muted)}
.totals b{color:var(--ink);font-family:var(--mono);font-weight:500}
.totals b.bad{color:var(--bad)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}

/* unit detail */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:10px 18px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0}
.linkbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--hover);border-radius:10px;padding:12px}
.linkbox p{margin:0;flex:1 1 220px;font-size:13px;color:var(--ink2)}
.statussel{min-height:34px;padding:4px 8px;font-size:13px}

/* new contract */
.nc{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.nc-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.nc-side{flex:1 1 340px;min-width:0;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.sec h2 .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lbl{font-size:13px;font-weight:500;color:var(--ink2)}
.f .hint{font-size:12px;color:var(--muted)}
.f input,.f select{width:100%}
.f [aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.prefix{display:flex}
.prefix span{display:flex;align-items:center;padding:0 10px;border:1px solid var(--rule2);border-right:0;border-radius:8px 0 0 8px;background:var(--hover);font-family:var(--mono);font-size:13px}
.prefix input{border-radius:0 8px 8px 0;flex:1;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:44px;justify-content:center;padding:6px 14px;border:1px solid var(--rule2);border-radius:8px;background:var(--paper);font-weight:500}
.seg span small{font-weight:400;color:var(--muted);font-size:12px}
.seg input:checked + span{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--info-bg)}
.seg input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.seg input:disabled + span{opacity:.4;cursor:default}
.outv{min-height:40px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:var(--hover);font-family:var(--mono);font-size:13px}
.sched td{padding:8px 6px;white-space:nowrap}
.sched input{min-height:34px;width:100%;min-width:90px;font-family:var(--mono);font-size:13px;padding:4px 8px}
.errors{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;font-size:13px}
.errors ul{margin:6px 0 0;padding-left:18px}
.unitnote{font-size:13px;color:var(--muted)}

/* MyC phone preview */
.phonewrap{position:fixed;z-index:50;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:360px;max-width:calc(100vw - 32px);background:var(--paper);border:1px solid var(--rule2);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:auto;padding:18px;gap:14px;animation:slide .28s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.phonewrap,.toast{animation:none}}
.ph-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph-head h2{font-size:16px;font-weight:600;margin-top:2px}
.ph-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.closebtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--rule2);background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
.phone{align-self:center;width:280px;max-width:100%;border-radius:38px;background:#1C1C1E;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.screen{border-radius:30px;background:var(--myc-bg);color:var(--myc-ink);min-height:470px;padding:22px 14px 16px;display:flex;flex-direction:column;gap:12px;font-family:'Newsreader',Georgia,serif;overflow:hidden}
.myc-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--myc-rule);padding-bottom:10px}
.myc-logo{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--myc-ink)}
.myc-logo i{color:var(--myc-accent);font-style:normal}
.myc-bld{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--myc-muted)}
.myc-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--myc-accent)}
.myc-card{background:var(--myc-card);border:1px solid var(--myc-rule);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.myc-card.old{opacity:.6}
.myc-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--myc-accent);text-transform:uppercase}
.myc-card p{margin:0;font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--myc-ink)}
.myc-meta{font-family:var(--sans);font-size:11px;color:var(--myc-muted);display:flex;justify-content:space-between}
.myc-reply{align-self:flex-start;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--myc-accent);border:1px solid var(--myc-accent);border-radius:999px;padding:4px 12px}
.sms{background:#F2F2F7;color:#111;font-family:var(--sans)}
.sms-top{text-align:center;font-size:12px;color:#555;border-bottom:1px solid #DDD;padding-bottom:10px}
.sms-top b{display:block;color:#111;font-size:14px}
.bubble{background:#E5E5EA;color:#111;border-radius:18px 18px 18px 6px;padding:10px 13px;font-size:13px;line-height:1.45;max-width:92%}
.bubble a{color:#0A5BD8}
.sms .time{font-size:11px;color:#777;text-align:center}
.ph-note{margin:0;font-size:12.5px;color:var(--muted);background:var(--hover);border-radius:10px;padding:10px 12px}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);animation:up .2s ease-out}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.foot{font-size:12px;color:var(--muted)}

/* ---- stage 2–4 additions ---- */
:root{--c-in:#1A2A40;--c-out:#E0A84A;--wa-bg:#E4F6EA;--wa-ink:#0B4F25}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-in:#9DB8E4;--c-out:#B47E26;--wa-bg:#14301F;--wa-ink:#9BE0B3}}
:root[data-theme="dark"]{--c-in:#9DB8E4;--c-out:#B47E26;--wa-bg:#14301F;--wa-ink:#9BE0B3}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--muted)}
tr.clickrow{cursor:pointer} tr.clickrow:hover td{background:var(--hover)} tr.cur td{background:var(--info-bg)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:20px;align-items:start}
@media (max-width:1150px){.split{grid-template-columns:minmax(0,1fr)}}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--rule)}
.timeline li{font-size:13px}
.timeline time{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.wa{background:var(--wa-bg);color:var(--wa-ink);border-radius:10px;padding:12px;font-size:13px;white-space:pre-line}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.drop{border:1.5px dashed var(--rule2);border-radius:12px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.drop p{margin:0;flex:1 1 240px;color:var(--muted);font-size:13px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .grid{stroke:var(--rule);stroke-width:1}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.checkgrid label{display:flex;gap:7px;align-items:center;border:1px solid var(--rule2);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:12px;cursor:pointer}
.checkgrid label.off{opacity:.45;cursor:default}
.matrix th,.matrix td{text-align:center} .matrix th:first-child,.matrix td:first-child{text-align:left}
.yes{color:var(--ok);font-weight:600} .no{color:var(--muted)}
details.vend{background:var(--paper);border:1px solid var(--rule);border-radius:12px}
details.vend summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
details.vend summary::-webkit-details-marker{display:none}
details.vend summary .grow{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
details.vend[open] summary{border-bottom:1px solid var(--rule)}
details.vend .body{padding:6px 18px 14px}
.inbox{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr) minmax(230px,280px);background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;height:max(540px,calc(100vh - 190px))}
@media (max-width:1200px){.inbox{grid-template-columns:minmax(220px,280px) minmax(0,1fr)}.ib-side{display:none!important}}
@media (max-width:760px){.inbox{grid-template-columns:minmax(0,1fr);height:auto}.ib-list{max-height:280px}.ib-msgs{min-height:320px}}
.ib-list{border-right:1px solid var(--rule);overflow:auto;display:flex;flex-direction:column;min-height:0}
.ib-tools{padding:12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.ib-tools select{width:100%}
.ib-item{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;color:var(--ink);width:100%}
.ib-item:hover{background:var(--hover)}
.ib-item[aria-current="true"]{background:var(--info-bg)}
.ib-item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ib-item .top b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-item .prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-item.unread .prev{color:var(--ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:999px;background:var(--focus);display:inline-block;flex:none}
.ib-conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.ib-head{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ib-head h2{font-size:16px;font-weight:600}
.ib-msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-height:0}
.msg{max-width:min(78%,520px);padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-line}
.msg.t{align-self:flex-start;background:var(--paper);border:1px solid var(--rule);border-bottom-left-radius:4px}
.msg.m{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg small{display:block;font-size:11px;opacity:.75;margin-top:4px}
.typing{align-self:flex-start;font-size:12px;color:var(--muted)}
.ib-comp{border-top:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:8px}
.ib-comp textarea{width:100%;min-height:62px;resize:vertical;padding:10px;border:1px solid var(--rule2);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.ib-comp .act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipbtn{border:1px solid var(--rule2);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink2);min-height:30px}
.chipbtn:hover{background:var(--hover)}
.ib-side{border-left:1px solid var(--rule);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ib-side h3{font-size:14px;font-weight:600}
.ib-side dl.kv{grid-template-columns:auto 1fr;font-size:13px;gap:8px 12px}
.textarea{width:100%;min-height:60px;padding:9px 11px;border:1px solid var(--rule2);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;resize:vertical}
.doclist{display:flex;flex-direction:column}
.doc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);font-size:13.5px}
.doc .grow{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.tile.nocontract{background:var(--info-bg);border:1px dashed var(--info)}
</style>
</head>
<body>

<div class="app">
  <aside class="side" aria-label="Portal navigation"><div class="side-in" id="nav"></div></aside>
  <main class="main" id="main"><div class="wrap"></div></main>
</div>
<div class="phonewrap" id="phone" hidden role="dialog" aria-label="Resident's view in MyC"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
/* ---------- dates & formatting ---------- */
const TODAY='2026-10-26';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad=n=>String(n).padStart(2,'0');
const P=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const I=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const addDays=(s,n)=>{const d=P(s);d.setUTCDate(d.getUTCDate()+n);return I(d);};
const addMonths=(s,n)=>{const d=P(s),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return I(d);};
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const fd=s=>{const d=P(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear();};
const fds=s=>{const d=P(s);return pad(d.getUTCDate())+' '+MON[d.getUTCMonth()].toUpperCase();};
const fmy=ym=>MON[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const aed=n=>(n<0?'−':'')+'AED '+Math.abs(Math.round(n)).toLocaleString('en-US');
const num=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('en-US');
const kAED=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:2).replace(/\.?0+$/,'')+'M':Math.round(n/1000)+'K';
const between=(s,a,b)=>s>=a&&s<=b;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmob=m=>'+971 '+m.slice(0,2)+' '+m.slice(2,5)+' '+m.slice(5);
const first=n=>String(n).split(' ')[0];
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const pct=(a,b)=>b?Math.round(a/b*100):null;

/* ---------- sample data ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const BANKS=['ADCB','FAB','Emirates NBD','Mashreq','ADIB','RAKBANK'];
const ROLES={
  manager:{label:'Portfolio manager',who:'Sara K.',see:['overview','collections','queue','residents','landlords','lease','new-lease','inbox','maintenance','assets','reports','settings','new','unit']},
  accounts:{label:'Accounts',who:'Rashid M.',see:['overview','collections','queue','residents','landlords','lease','new-lease','inbox','reports','new','unit']},
  operations:{label:'Operations',who:'Joseph P.',see:['overview','queue','residents','maintenance','assets','inbox','unit']}};
let S,U,B,route,sel=new Set(),form=null,stmt=null,imp=null,lform=null,drafts={},typing=null;
const can=n=>ROLES[S.viewAs].see.includes(n);
const me=()=>ROLES[S.viewAs].who;
const audit=(what,unit)=>S.audit.push({at:TODAY,t:nowHM(),who:me(),what,unit:unit||null});
const mid=u=>(u.min+u.max)/2;

function buildSchedule(start,months,rent,plan){
  const total=Math.round(rent*months/12),base=Math.floor(total/plan),rem=total-base*plan,step=months/plan;
  return Array.from({length:plan},(_,k)=>({due:addMonths(start,k*step),amount:base+(k===0?rem:0)}));
}
function makeContract(o){
  const id='c'+(S.seq++),end=addDays(addMonths(o.start,o.months),-1);
  const inst=buildSchedule(o.start,o.months,o.rent,o.plan).map((s,k,arr)=>({id:id+'-'+(k+1),n:k+1,of:arr.length,due:s.due,amount:s.amount,method:o.method,bank:o.method==='cheque'?o.bank:null,chequeNo:o.method==='cheque'?o.chequeNos[k]:null,status:o.method==='cheque'?'held':'due',reminders:[]}));
  return {id,unitId:o.unitId,tenant:o.tenant,start:o.start,end,months:o.months,rent:o.rent,deposit:o.deposit,plan:o.plan,method:o.method,twqNo:o.twqNo,twqEnd:o.twqEnd||end,status:'active',joined:false,renewal:null,installments:inst,docs:[],legal:'None',movedOut:null};
}
function makeLease(o){
  const id='ML-'+(101+S.leases.length),n=o.years*o.perYear,step=12/o.perYear,amt=Math.round(o.rent/o.perYear);
  const end=addDays(addMonths(o.start,o.years*12),-1);
  const inst=Array.from({length:n},(_,k)=>{const due=addMonths(o.start,k*step);return {id:id+'-'+(k+1),n:k+1,of:n,due,amount:amt,chequeNo:String(+o.firstCheque+k),status:due<TODAY?'paid':'issued'};});
  return {id,landlordId:o.landlordId,scope:o.scope,buildingId:o.buildingId,unitIds:o.unitIds||[],unitRents:o.unitRents||{},start:o.start,end,years:o.years,rent:o.rent,perYear:o.perYear,installments:inst};
}

function seed(){
  const r=rng(20261026),pick=a=>a[Math.floor(r()*a.length)];
  S={seq:1,buildings:[],units:[],contracts:[],tickets:[],audit:[],assets:[],vendors:[],landlords:[],leases:[],threads:[],members:[],viewAs:'manager',tk:1060};
  S.buildings=[
    {id:'mv',name:'Marina View Tower',short:'Marina View',code:'MV',floors:8,area:'Al Reem Island'},
    {id:'rg',name:'Reem Gate Residence',short:'Reem Gate',code:'RG',floors:6,area:'Al Reem Island'},
    {id:'cc',name:'Corniche Court',short:'Corniche Court',code:'CC',floors:5,area:'Corniche'},
    {id:'kh',name:'Khalidiya Heights',short:'Khalidiya',code:'KH',floors:4,area:'Khalidiya',onboarding:true}];
  const TYPES=[['Studio',42000,52000],['1 BR',64000,82000],['1 BR',66000,84000],['2 BR',95000,125000]];
  S.buildings.forEach(b=>{for(let f=1;f<=b.floors;f++)for(let p=1;p<=4;p++){const t=TYPES[p-1];S.units.push({id:b.code+'-'+pad(f)+pad(p),buildingId:b.id,floor:f,type:t[0],min:t[1],max:t[2]});}});
  U=Object.fromEntries(S.units.map(u=>[u.id,u]));B=Object.fromEntries(S.buildings.map(b=>[b.id,b]));
  const FN=['Ahmed','Fatima','Omar','Priya','James','Aisha','Hassan','Mei','Rania','Yusuf','Elena','Karim','Sofia','Arjun','Noura','Tom','Lena','Dmitri','Maryam','Rahul','Chloe','Khalid','Anika','Samir','Grace','Faisal','Hana','Vikram','Leila','Daniel','Zainab','Marco','Sana','Ibrahim','Nadia','Ravi','Amira','Lucas','Huda','Arif'];
  const LN=['Al Mansoori','Khan','Haddad','Nair','Walker','Rahman','Kowalski','Lin','Tahir','Gomez','Rossi','Bakr','Dimitriou','Patel','Hamdan','Evans','Fischer','Volkov','Saeed','Sharma','Martin','Al Ketbi','Das','Farouk','Okafor','Qureshi','Ito','Menon','Aziz','Silva'];
  const CO=['Gulfstream Logistics LLC','Falcon Engineering LLC','Bluewave Trading LLC','Noor Medical Centre'];
  S.units.forEach(u=>{
    if(u.buildingId==='kh'||r()>0.84)return;
    const company=r()<0.08;
    const k=Math.floor(r()*12),start=addMonths('2025-11-01',k).slice(0,8)+(r()<0.5?'01':'15');
    const plan=pick([4,4,4,4,2,2,12,1]),method=plan===12&&r()<0.6?'transfer':(r()<0.1?'transfer':'cheque');
    const rent=Math.round((u.min+r()*(u.max-u.min))/500)*500,bank=pick(BANKS),c0=100000+Math.floor(r()*800000);
    const c=makeContract({unitId:u.id,tenant:{type:company?'company':'individual',name:company?pick(CO):pick(FN)+' '+pick(LN),mobile:'5'+pick(['0','2','5','6','8'])+String(Math.floor(r()*1e7)).padStart(7,'0'),email:'',licence:company?'CN-'+(1000000+Math.floor(r()*8999999)):''},
      start,months:12,rent,deposit:Math.round(rent*0.05/100)*100,plan,method,bank,chequeNos:Array.from({length:plan},(_,i)=>String(c0+i)),twqNo:'TWQ-'+start.slice(0,4)+'-'+(100000+Math.floor(r()*899999))});
    c.joined=r()<0.72;
    c.docs=[{name:'Tenancy contract (signed).pdf',at:c.start},{name:'Tawtheeq certificate.pdf',at:addDays(c.start,3)},{name:company?'Trade licence.pdf':'Emirates ID.pdf',at:c.start}];
    c.installments.forEach(i=>{
      const d=diff(i.due,TODAY);
      if(i.method==='cheque'){i.status=d>5?'cleared':(d>=1?'deposited':'held');}
      else{i.status=d>0?((d<40&&r()<0.35)?'due':'paid'):'due';}
      if(i.status!=='cleared'&&i.status!=='paid'&&d>=-7&&d<=0)i.reminders.push({at:addDays(i.due,-7),channel:c.joined?'MyC push':'SMS',auto:true});
      if(i.method==='transfer'&&i.status==='due'&&d>0)i.reminders.push({at:addDays(i.due,3),channel:c.joined?'MyC push':'SMS',auto:true});
    });
    if(diff(TODAY,c.end)<=60)c.renewal=pick(['Not contacted','Not contacted','Reminder sent','Renewing','Moving out']);
    S.contracts.push(c);
  });
  const cand=S.contracts.flatMap(c=>c.installments.filter(i=>i.method==='cheque'&&i.status==='cleared'&&between(i.due,addDays(TODAY,-28),addDays(TODAY,-6))));
  [0,3,7].forEach(n=>{const i=cand[n%Math.max(cand.length,1)];if(i){i.status='bounced';i.reminders.push({at:addDays(i.due,4),channel:'MyC push',auto:false});}});
  const bc=S.contracts.find(c=>c.installments.some(i=>i.status==='bounced'));if(bc){bc.joined=true;bc.legal='Notice served';}

  /* vendors & assets */
  S.vendors=[
    {id:'v1',name:'CoolTech Services',trade:'AC & HVAC',contact:'Suresh P.',mobile:'501112233'},
    {id:'v2',name:'HomeFix Maintenance',trade:'Plumbing & appliances',contact:'Ali R.',mobile:'552349981'},
    {id:'v3',name:'BrightElec',trade:'Electrical',contact:'Manoj K.',mobile:'564410097'},
    {id:'v4',name:'Schindler',trade:'Lifts',contact:'Service desk',mobile:'508800120'},
    {id:'v5',name:'AquaFlow Pumps',trade:'Water & pumps',contact:'Tariq S.',mobile:'526678810'},
    {id:'v6',name:'SafeGuard Fire',trade:'Fire safety',contact:'Joel D.',mobile:'585521004'}];
  const VK={AC:'v1',HVAC:'v1','Water heater':'v2',Washer:'v2',Lift:'v4',Pump:'v5',Fire:'v6',Generator:'v3'};
  let an=1;const addA=(o)=>{const inst=2016+Math.floor(r()*8),cyc=o.kind==='AC'||o.kind==='HVAC'?180:o.kind==='Lift'?90:365;const last=addDays(TODAY,-Math.floor(r()*(cyc+40)));
    S.assets.push({id:'A-'+pad(an++).padStart(4,'0'),...o,installed:inst,warranty:inst+(o.kind==='Lift'?10:5),last,next:addDays(last,cyc),vendorId:VK[o.kind]});};
  S.units.forEach(u=>{
    const acs=u.type==='Studio'?['Split AC, living area']:u.type==='1 BR'?['Split AC, living room','Split AC, bedroom']:['Split AC, living room','Split AC, bedroom 1','Split AC, bedroom 2'];
    acs.forEach(n=>addA({name:n,kind:'AC',brand:pick(['Daikin','Gree','LG','Carrier']),buildingId:u.buildingId,unitId:u.id}));
    addA({name:'Water heater',kind:'Water heater',brand:pick(['Ariston','Rheem']),buildingId:u.buildingId,unitId:u.id});
    if(u.type!=='Studio'&&r()<0.6)addA({name:'Washing machine',kind:'Washer',brand:pick(['Bosch','Samsung','LG']),buildingId:u.buildingId,unitId:u.id});
  });
  S.buildings.forEach(b=>{
    addA({name:'Lift 1',kind:'Lift',brand:b.id==='rg'?'Otis':'Schindler',buildingId:b.id,unitId:null});
    if(b.floors>5)addA({name:'Lift 2',kind:'Lift',brand:b.id==='rg'?'Otis':'Schindler',buildingId:b.id,unitId:null});
    addA({name:'Water pump set',kind:'Pump',brand:'Grundfos',buildingId:b.id,unitId:null});
    addA({name:'Fire alarm panel',kind:'Fire',brand:'Notifier',buildingId:b.id,unitId:null});
    addA({name:'Chilled water AHU',kind:'HVAC',brand:'Trane',buildingId:b.id,unitId:null});
    if(b.id==='mv')addA({name:'Standby generator',kind:'Generator',brand:'Cummins',buildingId:b.id,unitId:null});
  });
  // make a few services overdue for realism
  S.assets.filter(a=>a.kind==='AC').slice(0,200).forEach((a,k)=>{if(k%23===0){a.last=addDays(TODAY,-205);a.next=addDays(a.last,180);}});

  /* landlords & master leases */
  S.landlords=[
    {id:'l1',name:'Al Noor Real Estate Investments',contact:'Khalid Al Noor',mobile:'502214410',bank:'FAB'},
    {id:'l2',name:'Hamdan Family Holdings',contact:'Mohammed Hamdan',mobile:'558701123',bank:'ADCB'},
    {id:'l3',name:'Gulf Horizon Properties',contact:'Leena Varghese',mobile:'523309087',bank:'Emirates NBD'}];
  const bsum=(bid,f)=>Math.round(S.units.filter(u=>u.buildingId===bid).reduce((s,u)=>s+mid(u),0)*f/5000)*5000;
  const urents=(ids,f)=>Object.fromEntries(ids.map(id=>[id,Math.round(mid(U[id])*f/500)*500]));
  S.leases.push(makeLease({landlordId:'l1',scope:'building',buildingId:'mv',start:'2024-03-05',years:5,rent:bsum('mv',0.68),perYear:4,firstCheque:'300101'}));
  S.leases.push(makeLease({landlordId:'l2',scope:'building',buildingId:'rg',start:'2025-07-01',years:3,rent:bsum('rg',0.70),perYear:2,firstCheque:'300201'}));
  const cc1=S.units.filter(u=>u.buildingId==='cc'&&u.floor<=3).map(u=>u.id),cc2=S.units.filter(u=>u.buildingId==='cc'&&u.floor>3).map(u=>u.id);
  let ur=urents(cc1,0.72);S.leases.push(makeLease({landlordId:'l3',scope:'units',buildingId:'cc',unitIds:cc1,unitRents:ur,start:'2025-11-15',years:3,rent:Object.values(ur).reduce((a,b)=>a+b,0),perYear:4,firstCheque:'300301'}));
  ur=urents(cc2,0.74);S.leases.push(makeLease({landlordId:'l2',scope:'units',buildingId:'cc',unitIds:cc2,unitRents:ur,start:'2026-02-10',years:2,rent:Object.values(ur).reduce((a,b)=>a+b,0),perYear:2,firstCheque:'300401'}));

  /* maintenance tickets */
  const occ=bid=>S.contracts.filter(c=>U[c.unitId].buildingId===bid);
  const T=[
    ['AC not cooling','AC','mv',0,'new','High',0,'07:40',null],

/* ---------- collections ---------- */
function colRows(){
  const t=route.tab,bid=route.cb,q=route.q.trim().toLowerCase();
  let xs=all().filter(x=>bid==='all'||x.u.buildingId===bid);
  const tabs={attn:x=>needsAction(x.i)||(!settled(x.i)&&x.i.status!=='deposited'&&between(x.i.due,TODAY,addDays(TODAY,6))),bounced:x=>x.i.status==='bounced',dep:x=>x.i.status==='deposited',up:x=>!settled(x.i)&&between(x.i.due,TODAY,addDays(TODAY,30)),all:()=>true};
  const counts=Object.fromEntries(Object.keys(tabs).map(k=>[k,xs.filter(tabs[k]).length]));
  xs=xs.filter(tabs[t]);
  if(q)xs=xs.filter(x=>(x.c.tenant.name+' '+x.u.id+' '+(x.i.chequeNo||'')).toLowerCase().includes(q));
  xs.sort(t==='all'?(a,b)=>-byDue(a,b):byDue);
  return {xs,counts};
}
function vCollections(){
  const {counts}=colRows();

    <div class="tools"><label class="field-inline" for="col-q">Search<input type="search" id="col-q" placeholder="Tenant, unit or cheque no." value="${esc(route.q)}" style="width:230px"></label>${bldSelect('col-building',route.cb)}<button type="button" class="btn" data-action="goto-import">Import bank statement</button></div></header>
   ${tabsHtml([['attn','Overdue & this week'],['bounced','Bounced'],['dep','Deposited, awaiting clearance'],['up','Next 30 days'],['all','All']],route.tab,'tab',counts)}

}
function fillCollections(){

  const over=xs.filter(x=>needsAction(x.i)).reduce((s,x)=>s+x.i.amount,0),open=xs.filter(x=>!settled(x.i)).reduce((s,x)=>s+x.i.amount,0);
  const bar=sel.size?`<div class="bulk on"><b>${sel.size} selected · <span class="mono">${aed(amt)}</span></b><span class="sp"></span>

    ${xs.length?xs.map(x=>`<tr class="${sel.has(x.i.id)?'selected':''}"><td><input type="checkbox" data-action="toggle-sel" data-inst="${x.i.id}" aria-label="Select ${esc(x.c.tenant.name)} ${x.i.n} of ${x.i.of}" ${sel.has(x.i.id)?'checked':''}></td>
      <td class="mono" style="color:${needsAction(x.i)?'var(--bad)':'inherit'}">${fds(x.i.due)}</td>
      <td><button type="button" class="namebtn" data-action="open-unit" data-unit="${x.u.id}">${esc(x.c.tenant.name)}</button><div class="muted mono" style="font-size:12px">${x.u.id}</div></td>
      <td>${x.i.n} of ${x.i.of}</td><td class="muted">${esc(methodTxt(x.i))}</td><td class="r mono">${num(x.i.amount)}</td><td>${chip(x.i)}</td><td class="muted" style="font-size:12.5px">${lastRem(x.i)}</td>

    </tbody></table></div></section>
    <p class="foot">Showing ${xs.length} payment${xs.length===1?'':'s'}.</p>`;

function submitForm(){

function bindForm(){
  const el=$('nc');fillUnits();

  el.addEventListener('input',e=>{const t=e.target;
    if(t.type==='file')return;
    if(t.dataset.row!==undefined){form.over[t.dataset.row]=t.value;return;}
    if(t.id==='nc-twqend')form.twqTouched=true;if(t.id==='nc-dep')form.depTouched=true;
    if(t.id==='nc-chq'||t.name==='nc-plan'||t.id==='nc-months'||t.id==='nc-start')form.over={};
    if(t.getAttribute('aria-invalid')==='true')t.setAttribute('aria-invalid','false');

function sendMsg(){

  const text=ta.value.trim();if(!text)return;
  const c=contractFor(t.unitId),toSel=$('ib-to'),to=toSel?toSel.value:'all',n=resOf(t.unitId).length;
  t.msgs.push({from:'m',text,to,at:'Today '+nowHM()});t.ts=++S.seq+1000;drafts[t.unitId]='';audit(to==='all'?`Messaged all ${n} residents`:'Messaged contract holder',t.unitId);
  route.thread=t.unitId;render();toast(to==='all'?`Sent to ${n} resident${n===1?'':'s'} in MyC`:(c&&c.joined?'Delivered to the contract holder in MyC':'Contract holder not on MyC · sent by SMS'));
  if((to==='all'&&n)||(c&&c.joined)){const R=['Thanks, noted.','Okay, thank you for letting me know.','Got it, thanks!','Sounds good. Thank you.'];
    setTimeout(()=>{typing=t.unitId;if(route.name==='inbox')render();},900);
    setTimeout(()=>{typing=null;t.msgs.push({from:'t',text:R[t.msgs.length%R.length],at:'Today '+nowHM()});t.ts=++S.seq+1000;if(route.name==='inbox'&&route.thread===t.unitId)render();else{t.unread=true;renderNav();}},2600);}
}

const RTABS=[['aging','Aging'],['cash','Cash flow'],['roll','Rent roll'],['occ','Occupancy'],['eff','Collection rate'],['profit','Profit by property'],['import','Bank statement import']];

function rAging(){
  const cols=[['nd','Not yet due'],['cl','Awaiting clearance'],['b1','1–30 days'],['b2','31–60'],['b3','61–90'],['b4','90+']];
  const bk=x=>{if(x.i.status==='deposited')return 'cl';const d=diff(x.i.due,TODAY);if(d<=0&&x.i.status!=='bounced')return 'nd';return d<=30?'b1':d<=60?'b2':d<=90?'b3':'b4';};
  const xs=all().filter(x=>!settled(x.i));
  const rows=S.buildings.map(b=>{const r={};cols.forEach(([k])=>r[k]=0);xs.filter(x=>x.u.buildingId===b.id).forEach(x=>r[bk(x)]+=x.i.amount);return [b,r];});
  const tot={};cols.forEach(([k])=>tot[k]=rows.reduce((s,[,r])=>s+r[k],0));

   <tr><td><b>Total</b></td>${cols.map(([k])=>`<td class="r mono"><b style="font-weight:600">${num(tot[k])}</b></td>`).join('')}<td class="r mono"><b style="font-weight:600;color:var(--bad)">${num(tot.b1+tot.b2+tot.b3+tot.b4)}</b></td></tr></tbody></table></div></section>

function rCash(){
  const months=Array.from({length:6},(_,k)=>addMonths('2026-11-01',k).slice(0,7));
  const proj=active().filter(c=>c.renewal!=='Moving out'&&c.end<=months[5]+'-31').flatMap(c=>buildSchedule(addDays(c.end,1),12,c.rent,c.plan));
  const data=months.map(m=>{const sch=all().filter(x=>x.i.due.slice(0,7)===m&&!settled(x.i)&&x.i.status!=='bounced').reduce((s,x)=>s+x.i.amount,0),pr=proj.filter(x=>x.due.slice(0,7)===m).reduce((s,x)=>s+x.amount,0),inn=sch+pr;
    const out=S.leases.flatMap(l=>l.installments).filter(i=>i.due.slice(0,7)===m&&i.status!=='paid').reduce((s,i)=>s+i.amount,0);return {m,inn,pr,out,net:inn-out};});
  let cum=0;data.forEach(d=>{cum+=d.net;d.cum=cum;});
  const mx=Math.max(...data.map(d=>Math.max(d.inn,d.out)),1),step=Math.pow(10,Math.floor(Math.log10(mx/4))),nice=Math.ceil(mx/4/step)*step,top=nice*4;
  const W=720,H=270,L=64,R=12,T=14,Bm=34,cw=(W-L-R)/data.length,y=v=>T+(H-T-Bm)*(1-v/top),bw=Math.min(28,cw/3.2);
  const grid=[0,1,2,3,4].map(k=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(nice*k)}" y2="${y(nice*k)}"/><text x="${L-8}" y="${y(nice*k)+4}" text-anchor="end">${k?kAED(nice*k):'0'}</text>`).join('');
  const bars=data.map((d,k)=>{const cx=L+cw*k+cw/2;return `<rect x="${cx-bw-2}" y="${y(d.inn)}" width="${bw}" height="${y(0)-y(d.inn)}" fill="var(--c-in)" rx="2"><title>${fmy(d.m)} in: ${aed(d.inn)}</title></rect><rect x="${cx+2}" y="${y(d.out)}" width="${bw}" height="${y(0)-y(d.out)}" fill="var(--c-out)" rx="2"><title>${fmy(d.m)} out: ${aed(d.out)}</title></rect><text x="${cx}" y="${H-12}" text-anchor="middle">${fmy(d.m).toUpperCase()}</text>`;}).join('');

function sampleStatement(){
  const dep=all().filter(x=>x.i.status==='deposited').slice(0,7),tr=all().filter(x=>x.i.method==='transfer'&&overdue(x.i)).slice(0,2);
  const L=[];dep.forEach((x,k)=>L.push([addDays(x.i.due,1),`CHQ DEP ${x.i.chequeNo} ${x.u.id}`,x.i.amount]));
  if(dep.length>2){const x=dep[dep.length-1];L.push([addDays(x.i.due,3),`RETURNED CHQ ${x.i.chequeNo} INSUFFICIENT FUNDS`,-x.i.amount]);}
  tr.forEach(x=>L.push([TODAY,`IPI TRF FROM ${x.c.tenant.name.toUpperCase()} REF ${x.u.id}`,x.i.amount]));
  L.push([addDays(TODAY,-2),'ADDC UTILITY PAYMENT BLDG MV',-18450.5]);L.push([addDays(TODAY,-1),'BANK CHARGES OCT',-157.5]);
  return L.sort((a,b)=>a[0]<b[0]?-1:1).map(([date,desc,amount])=>({date,desc,amount}));
}
function matchLines(lines){
  const ret=new Set(lines.filter(l=>/RETURN/i.test(l.desc)).map(l=>(l.desc.match(/\b\d{6}\b/)||[])[0]));
  return lines.map(l=>{const no=(l.desc.match(/\b\d{6}\b/)||[])[0];let m=null;
    if(no){const x=all().find(y=>y.i.chequeNo===no);if(x){if(/RETURN/i.test(l.desc))m={x,act:'bounced'};else if(!ret.has(no)&&!settled(x.i))m={x,act:'cleared'};else if(ret.has(no))m={x,act:'skip'};}}
    if(!m){const u=(l.desc.match(/\b[A-Z]{2}-\d{4}\b/)||[])[0];if(u&&l.amount>0){const x=all().find(y=>y.u.id===u&&!settled(y.i)&&Math.abs(y.i.amount-l.amount)<1);if(x)m={x,act:'paid'};}}
    return {...l,m,apply:!!m&&m.act!=='skip'};});
}
function parseCsv(text){return text.split(/\r?\n/).map(r=>r.split(',')).filter(c=>c.length>=3&&!isNaN(parseFloat(c[c.length-1]))).map(c=>({date:/^\d{4}-\d{2}-\d{2}$/.test(c[0].trim())?c[0].trim():TODAY,desc:c.slice(1,-1).join(',').trim(),amount:parseFloat(c[c.length-1])}));}

function sendReminders(ids){
  const xs=ids.map(findInst).filter(Boolean);if(!xs.length)return;
  xs.forEach(x=>x.i.reminders.push({at:TODAY,channel:x.c.joined?'MyC push':'SMS',auto:false}));
  audit(`Sent ${xs.length} payment reminder${xs.length>1?'s':''}`,xs.length===1?xs[0].u.id:null);
  const x=xs[0],[tag,text]=msgFor(x),sms=xs.filter(y=>!y.c.joined).length;
  phone(x.c,tag,text,xs.length>1?`Reminder sent to ${xs.length} tenants`:'Reminder sent',
    xs.length>1?`Showing ${esc(first(x.c.tenant.name))}'s message. Each tenant gets their own amount, date and cheque number.${sms?` ${sms} not on MyC yet received it by SMS.`:''}`:(x.c.joined?'':'This tenant is not on MyC yet, so the reminder went by SMS.'));
  toast(xs.length>1?`Reminders sent to ${xs.length} tenants`:`Reminder sent to ${first(x.c.tenant.name)}`);
}
